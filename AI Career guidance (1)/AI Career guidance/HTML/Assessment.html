<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Skill Assessment</title>
   <!--Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
<!-- Your CSS  -->
    <link rel="stylesheet" href="../CSS/Style.css">

</head>

<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand">
            🤖 AI Career Guide
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="card shadow p-4">

        <h2 class="text-center">
            📝 Skill Assessment
        </h2>

        <p class="text-center text-muted">
            Select the skills you currently have.
        </p>


        <div class="row mt-4">


            <div class="col-md-6">

                <h4>Technical Skills</h4>

                <div class="form-check">
                    <input class="form-check-input skill"
                           type="checkbox"
                           value="SQL">
                    <label class="form-check-label">
                        SQL
                    </label>
                </div>


                <div class="form-check">
                    <input class="form-check-input skill"
                           type="checkbox"
                           value="Python">
                    <label class="form-check-label">
                        Python
                    </label>
                </div>


                <div class="form-check">
                    <input class="form-check-input skill"
                           type="checkbox"
                           value="JavaScript">
                    <label class="form-check-label">
                        JavaScript
                    </label>
                </div>


                <div class="form-check">
                    <input class="form-check-input skill"
                           type="checkbox"
                           value="Excel">
                    <label class="form-check-label">
                        Excel
                    </label>
                </div>

            </div>


            <div class="col-md-6">

                <h4>Soft Skills</h4>

                <div class="form-check">
                    <input class="form-check-input skill"
                           type="checkbox"
                           value="Communication">
                    <label class="form-check-label">
                        Communication
                    </label>
                </div>


                <div class="form-check">
                    <input class="form-check-input skill"
                           type="checkbox"
                           value="Leadership">
                    <label class="form-check-label">
                        Leadership
                    </label>
                </div>


                <div class="form-check">
                    <input class="form-check-input skill"
                           type="checkbox"
                           value="Problem Solving">
                    <label class="form-check-label">
                        Problem Solving
                    </label>
                </div>

            </div>

        </div>


        <div class="text-center mt-5">

            <button onclick="analyzeSkills()"
                    class="btn btn-primary btn-lg">

                🤖 Analyze My Skills

            </button>

        </div>

    </div>

</div>


<script src="../JS/Script.js"></script>

</body>
</html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand">
            🤖 AI Career Guide
        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="card shadow p-4">

        <h2>👤 Student Profile</h2>

        <hr>


        <form onsubmit="saveProfile(event)">

            <div class="row">

                <!-- Full Name -->
                <div class="col-md-6">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           id="name"
                           class="form-control"
                           placeholder="Enter your name">

                </div>


                <!-- Email -->
                <div class="col-md-6">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           class="form-control"
                           placeholder="Enter your email">

                </div>


                <!-- Phone -->
                <div class="col-md-6 mt-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input type="text"
                           id="phone"
                           class="form-control"
                           placeholder="Enter your phone number">

                </div>


                <!-- Qualification -->
                <div class="col-md-6 mt-3">

                    <label class="form-label">
                        Qualification
                    </label>

                    <select class="form-control"
                            id="qualification">

                        <option>MBA</option>
                        <option>MCA</option>
                        <option>BCA</option>
                        <option>B.Com</option>

                    </select>

                </div>


                <!-- Specialization -->
                <div class="col-md-6 mt-3">

                    <label class="form-label">
                        Specialization
                    </label>

                    <input type="text"
                           id="specialization"
                           class="form-control"
                           placeholder="Finance / HR / IT">

                </div>


                <!-- Save Button -->
                <div class="col-12 mt-4">

                    <button type="submit"
                            class="btn btn-primary">

                        Save Profile

                    </button>

                </div>

            </div>

        </form>

    </div>

</div>


<!-- JavaScript -->
<script src="js/script.js"></script>

</body>

</html>
